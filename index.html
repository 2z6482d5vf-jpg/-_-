<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="mobile-web-app-capable" content="yes">

<title>トレーニング記録</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Layout: 1画面アプリ。今日＝一覧→種目に集中する画面。大きな文字・はっきりした境界・ボタンは親指で押せる大きさ */
:root{
  --bg:#ECEEF2; --card:#FFFFFF; --line:#CDD2DA; --ink:#0E1116; --sub:#3F4652; --mute:#666D79;
  --acc:#1F5FC8; --acc-ink:#FFFFFF; --acc-soft:#E3ECFB; --ok:#0E8F4F; --ok-soft:#DCF2E5; --ok-ink:#FFFFFF;
  --up:#B93F0A; --up-soft:#FCE6D8; --prev:#F1F2F5; --steel:#8A8F97; --steel2:#C9CDD3;
  --font:"BIZ UDPGothic","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  --num:"Barlow","BIZ UDPGothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D0F12; --card:#181B20; --line:#30353D; --ink:#F4F5F7; --sub:#C9CED6; --mute:#9BA2AD;
  --acc:#6E9BFF; --acc-ink:#0D0F12; --acc-soft:#1B2740; --ok:#35D07C; --ok-soft:#12301F; --ok-ink:#0D0F12;
  --up:#FF9A5C; --up-soft:#3A2416; --prev:#22262C; --steel:#7C8088; --steel2:#4E535B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D0F12; --card:#181B20; --line:#30353D; --ink:#F4F5F7; --sub:#C9CED6; --mute:#9BA2AD;
  --acc:#6E9BFF; --acc-ink:#0D0F12; --acc-soft:#1B2740; --ok:#35D07C; --ok-soft:#12301F; --ok-ink:#0D0F12;
  --up:#FF9A5C; --up-soft:#3A2416; --prev:#22262C; --steel:#7C8088; --steel2:#4E535B; color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:left}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.n{font-family:var(--num);font-variant-numeric:tabular-nums;letter-spacing:.2px}
main{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:40px calc(92px + env(safe-area-inset-bottom,0px));display:grid;gap:14px}
h1{font-size:26px;margin:0;font-weight:700;text-wrap:balance}
.date{font-size:15px;color:var(--sub);font-weight:700}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:16px}
/* 切り替え */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.seg button{border-radius:10px;padding:10px 4px;text-align:center;font-weight:700;font-size:16px;color:var(--sub)}
.seg button small{display:block;font-size:12px;font-weight:400;color:var(--mute)}
.seg button.on{background:var(--acc);color:var(--acc-ink)}
.seg button.on small{color:var(--acc-ink);opacity:.85}
.why{font-size:14px;color:var(--sub);margin:-4px 4px 0}
/* 一覧の行 */
.list{display:grid;gap:8px}
.exrow{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:10px 14px 10px 10px;width:100%}
.exrow .nm{font-weight:700;font-size:17px;line-height:1.3}
.exrow .tg{font-size:15px;color:var(--sub);margin-top:2px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.exrow2{display:grid}
.exrow2.done{opacity:.6}
.swap{font-size:14px;font-weight:700;color:var(--acc);padding:9px 14px;border-top:1.5px solid var(--line);text-align:left;width:100%}
.bbt{color:var(--ok);font-weight:700}.bbt.late{color:var(--up)}
.elap{font-size:14px;font-weight:700;color:var(--acc)}
.goal{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;gap:12px}
.gd{display:flex;gap:6px}
.gd i{width:22px;height:22px;border-radius:50%;border:2.5px solid var(--line)}
.gd i.on{background:var(--ok);border-color:var(--ok)}
.reps{display:grid;grid-template-columns:1fr 1fr 1.5fr 1fr 1fr;gap:6px}
.reps button{border-radius:12px;padding:10px 0 8px;text-align:center;background:var(--card);border:1.5px solid var(--line);display:grid;gap:2px;justify-items:center}
.reps b{font-size:24px;line-height:1}
.reps small{font-size:11px;font-weight:700;color:var(--mute);min-height:14px}
.reps .main{background:var(--ok);border-color:var(--ok);color:var(--ok-ink)}
.reps .main small{color:var(--ok-ink)}
.reps .sel{outline:3px solid var(--acc);outline-offset:1px}
.dock{position:fixed;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom,0px));z-index:15;background:var(--card);border-top:1.5px solid var(--line);box-shadow:0 -6px 18px rgba(0,0,0,.08);padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));display:grid;gap:10px;max-width:100%}
.dock>*{max-width:528px;width:100%;margin:0 auto}
.dock.slim{background:transparent;border:0;box-shadow:none;padding-block:8px}
.dk1{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:28px}
.dk1 b{font-size:16px}
.dk3{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.nb{display:flex;align-items:center;gap:6px;min-height:54px;padding:6px 10px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);font-weight:700;font-size:15px;color:var(--ink);min-width:0}
.nb .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.25}
.nb .t small{display:block;font-size:11px;color:var(--mute)}
.nb .ar2{color:var(--acc);font-size:22px;line-height:1}
.dk3 .nb:last-child{text-align:right}
.nb.hi{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.nb.hi .t small,.nb.hi .ar2{color:var(--acc-ink)}
.nb.off{justify-content:center;color:var(--mute);font-weight:400;font-size:13px;border-style:dashed;background:transparent}
.alts{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:8px 10px;border-top:1.5px solid var(--line)}
.card>.alts{border-top:0}
.alts-l{font-size:13px;font-weight:700;color:var(--sub);margin-right:2px}
.alt{display:inline-flex;align-items:center;gap:4px;padding:4px 10px 4px 4px;border:1.5px solid var(--line);border-radius:20px;font-size:13px;font-weight:700;color:var(--acc);background:var(--card)}
.alt svg{width:26px;height:26px;color:var(--ink)}
.bform{display:grid;gap:10px;padding:12px 14px}
.bform label{display:flex;align-items:center;gap:10px;font-weight:700}
.bform input{flex:1;text-align:right;border:1.5px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);font-family:var(--num);font-size:22px;font-weight:700}
.fin{display:flex;gap:12px;align-items:center;font-weight:700;font-size:17px}
.fin small{font-weight:400;font-size:13px;color:var(--sub)}
.fin .check{flex:none;width:40px;height:40px;font-size:20px}
.skip{font-size:14px;font-weight:700;color:var(--acc);margin-left:10px;padding:4px 6px;border:1.5px solid var(--line);border-radius:8px}
.iost{font-size:13px;font-weight:700;color:var(--acc);margin-left:8px}
.pos{font-size:13px;color:var(--mute);font-weight:700}
.fview{display:grid;gap:14px;touch-action:pan-y;will-change:transform}
.dock{touch-action:pan-y}
.tipsbox{padding:0}
.tipsbox summary{list-style:none;padding:12px 14px;font-weight:700;color:var(--acc);cursor:pointer}
.tipsbox summary::-webkit-details-marker{display:none}
.tipsbox .tips{padding-top:0}
.slh{display:grid;grid-template-columns:30px 1fr 18px 1fr 34px;gap:6px;padding:8px 14px 0;font-size:12px;font-weight:700;color:var(--mute)}
.hold{display:grid;gap:8px}
.hold-v{display:flex;align-items:baseline;justify-content:center;gap:8px}
.hold-v b{font-size:52px;font-weight:700;line-height:1}
.hold-v small{font-size:17px;color:var(--sub);font-weight:700}
.hold-p{font-size:18px;font-weight:700;color:var(--up);min-width:3em;text-align:right}
.hbar{height:10px;border-radius:5px;background:var(--prev);overflow:hidden}
.hbar i{display:block;height:100%;width:0;background:var(--ok);border-radius:5px}
.toast{display:flex;align-items:center;gap:12px}
.undo{color:var(--card);font-weight:700;text-decoration:underline;font-size:15px;padding:2px 0}
.srow2.col{flex-direction:column;align-items:stretch;gap:8px}
.srow2 input.wide{width:100%;text-align:left;font-family:var(--font);font-size:15px;font-weight:400}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.mini{font-size:14px;font-weight:700;color:var(--acc);border:1.5px solid var(--line);border-radius:10px;padding:6px 10px;background:var(--card)}
.coach{display:flex;gap:10px;align-items:flex-start;background:var(--acc-soft);border-radius:14px;padding:12px 14px;font-size:15px}
.coach b{flex:none;background:var(--acc);color:var(--acc-ink);border-radius:8px;padding:1px 8px;font-size:13px;margin-top:1px}
.dots{display:flex;gap:4px}
.dots i{width:10px;height:10px;border-radius:50%;border:2px solid var(--line)}
.dots i.on{background:var(--ok);border-color:var(--ok)}
.ico{width:52px;height:52px;border-radius:12px;background:var(--acc-soft);color:var(--ink);display:grid;place-items:center;flex:none}
.ico svg{width:44px;height:44px}
.pict{fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.pict .hd{fill:currentColor;stroke:none}
.pict .eq{stroke:var(--acc)}
.pict .eqf{fill:var(--acc);stroke:none}
.pict .gr{stroke:var(--mute);stroke-width:2}
.pict .dash{stroke-dasharray:2 4}
.chip{display:inline-flex;align-items:center;gap:2px;font-size:13px;font-weight:700;padding:1px 8px;border-radius:20px;white-space:nowrap}
.chip.up{background:var(--up-soft);color:var(--up)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.down{background:var(--prev);color:var(--sub)}
.check{width:30px;height:30px;border-radius:50%;border:2.5px solid var(--line);display:grid;place-items:center;font-weight:700;color:transparent}
.check.on{background:var(--ok);border-color:var(--ok);color:var(--ok-ink)}
.big{display:block;width:100%;border-radius:14px;padding:16px;text-align:center;font-weight:700;font-size:18px;background:var(--acc);color:var(--acc-ink)}
.big.ok{background:var(--ok);color:var(--ok-ink)}
.big.ghost{background:var(--card);color:var(--acc);border:1.5px solid var(--line)}
.done-banner{padding:16px;text-align:center;font-weight:700;background:var(--ok-soft);color:var(--ok);border-radius:16px}
/* 集中画面 */
.fbar{display:flex;justify-content:space-between;align-items:center;min-height:40px}
.fbar button{font-weight:700;color:var(--acc);font-size:16px;padding:6px 0}
.fbar .pos{font-size:15px;color:var(--sub);font-weight:700}
.fhead{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center}
.fhead .ico{width:64px;height:64px}
.fhead .ico svg{width:54px;height:54px}
.fhead h2{font-size:21px;margin:0;line-height:1.3}
.fhead .tg{font-size:15px;color:var(--sub);display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:2px}
.tips{margin:0;padding:12px 14px 12px 32px;font-size:15px;color:var(--sub)}
.barbox{padding:10px 8px 12px}
.barbox svg{display:block;width:100%;height:auto}
.load{display:flex;justify-content:space-between;align-items:baseline;padding:2px 8px 0;gap:8px;flex-wrap:wrap}
.load .tot{font-size:30px;font-weight:700}
.load .how{font-size:15px;font-weight:700;color:var(--acc)}
.setpanel{padding:14px;display:grid;gap:12px}
.sp-h{display:flex;justify-content:space-between;align-items:center}
.sp-h b{font-size:17px}
.rest{font-size:15px;font-weight:700;color:var(--up)}
.vs{display:grid;grid-template-columns:1fr 1.6fr;gap:10px}
.vs .col{border-radius:12px;padding:10px 12px}
.vs .prevc{background:var(--prev)}
.vs .nowc{background:var(--acc-soft);border:2px solid var(--acc)}
.vs .lab{font-size:13px;font-weight:700;color:var(--sub)}
.vs .prevc .v{font-size:24px;font-weight:700;color:var(--sub)}
.vs .prevc .v small{font-size:14px}
.stp{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:4px}
.stp button{width:40px;height:40px;border-radius:10px;background:var(--card);border:1.5px solid var(--line);font-size:22px;font-weight:700;text-align:center;line-height:1;color:var(--ink)}
.stp .v{font-size:26px;font-weight:700;text-align:center;flex:1}
.stp .v small{font-size:14px;font-family:var(--font)}
.setlist{display:grid}
.srow{display:grid;grid-template-columns:30px 1fr 18px 1fr 34px;align-items:center;gap:6px;padding:10px 14px;width:100%;border-top:1.5px solid var(--line)}
.srow:first-child{border-top:0}
.srow.cur{background:var(--acc-soft)}
.srow .no{font-weight:700;color:var(--sub)}
.srow .p{color:var(--mute);font-size:16px}
.srow .c{font-weight:700;font-size:17px}
.srow .ar{color:var(--mute);text-align:center}
.next{display:flex;align-items:center;gap:12px;padding:10px 14px 10px 10px;width:100%}
.next .ico{width:40px;height:40px}.next .ico svg{width:34px;height:34px}
.next .t{flex:1;min-width:0}
.next .t small{display:block;color:var(--mute);font-size:13px;font-weight:700}
/* 有酸素 */
.types{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.types button{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:10px 2px 8px;display:grid;justify-items:center;gap:4px;font-size:12.5px;white-space:nowrap;font-weight:700;text-align:center;line-height:1.25}
.types button svg{width:38px;height:38px}
.types button.on{border-color:var(--acc);background:var(--acc-soft)}
.crow{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;gap:10px}
.crow+.crow{border-top:1.5px solid var(--line)}
.crow .stp{margin:0;gap:10px}
.crow .stp .v{min-width:86px}
.crow input{width:96px;text-align:right;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--bg);font-family:var(--num);font-size:20px;font-weight:700}
.hint{font-size:14px;color:var(--sub);padding:0 4px}
/* 記録 */
.stat{padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
.stat .k{font-size:14px;color:var(--sub);font-weight:700}
.stat .bigv{font-size:30px;font-weight:700}
.stat .bigv small{font-size:15px;font-family:var(--font)}
.spark{width:120px;height:40px}
.hrow{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:10px 14px 10px 10px;width:100%}
.hrow+.hrow,.hdet+.hrow{border-top:1.5px solid var(--line)}
.hrow .ico{width:44px;height:44px}.hrow .ico svg{width:38px;height:38px}
.hrow .nm{font-weight:700;font-size:16px}
.hrow .sm{font-size:14px;color:var(--sub)}
.hrow .r{text-align:right}
.hrow .r b{font-size:20px}
.hdet{padding:4px 14px 14px}
.hdet svg{display:block;width:100%;height:auto;overflow:visible}
.hdet text{fill:var(--mute);font-size:11px;font-family:var(--num)}
.hist{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:15px;margin-top:8px;color:var(--sub)}
.hist b{color:var(--ink)}
.sec{font-size:15px;font-weight:700;color:var(--sub);margin:6px 4px -6px}
.note{font-size:13px;color:var(--mute);margin:0 4px}
/* 設定 */
.srow2{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;width:100%}
.srow2+.srow2{border-top:1.5px solid var(--line)}
.srow2 input{width:84px;text-align:right;border:1.5px solid var(--line);border-radius:10px;padding:6px 10px;background:var(--bg);font-family:var(--num);font-size:18px;font-weight:700}
.srow2 .v{color:var(--sub);font-weight:700}
.rule{padding:12px 14px;font-size:15px;color:var(--sub);display:grid;gap:6px}
.rule b{color:var(--ink)}
/* タブバー */
nav{position:fixed;height:calc(66px + env(safe-area-inset-bottom,0px));left:0;right:0;bottom:0;background:var(--card);border-top:1.5px solid var(--line);display:flex;justify-content:space-around;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));z-index:20}
nav button{display:grid;justify-items:center;gap:2px;font-size:12px;font-weight:700;color:var(--mute);min-width:80px;padding:4px 0}
nav button.on{color:var(--acc)}
nav svg{width:28px;height:28px}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--card);font-size:15px;font-weight:700;padding:10px 18px;border-radius:24px;z-index:30;white-space:nowrap}
@media (prefers-reduced-motion:no-preference){.srow,.seg button,.check{transition:background .15s}}
</style>

<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const kg=n=>String(Math.round(n*100)/100);
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const TODAY=iso(new Date());
const WD=['日','月','火','水','木','金','土'];
const md=s=>{const[y,m,d]=s.split('-').map(Number);return m+'/'+d;};
const mdw=s=>{const[y,m,d]=s.split('-').map(Number);return m+'月'+d+'日（'+WD[new Date(y,m-1,d).getDay()]+'）';};
const tOf=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d).getTime();};
const daysAgo=s=>Math.round((tOf(TODAY)-tOf(s))/864e5);

/* ===== ピクトグラム（48×48） ===== */
const hd=(x,y)=>`<circle class="hd" cx="${x}" cy="${y}" r="4"/>`;
const pa=(d,c='')=>`<path ${c?`class="${c}"`:''} d="${d}"/>`;
const gnd=(y=44)=>pa(`M5 ${y} H43`,'gr');
const db=(x,y)=>pa(`M${x-5} ${y} H${x+5}`,'eq')+`<rect class="eqf" x="${x-7.5}" y="${y-3.5}" width="3.5" height="7" rx="1"/><rect class="eqf" x="${x+4}" y="${y-3.5}" width="3.5" height="7" rx="1"/>`;
const PICT={

/* ===== 重さの計算 ===== */
const collarKg=()=>DB.settings.useCollar?DB.settings.collar:0;
function snap2(id,v){
  const e=EX[id];
  if(e.eq==='barbell'){const base=DB.settings.bar+2*collarKg();const side=Math.max(0,Math.floor(((v-base)/2)/1.25+1e-6)*1.25);return Math.round((base+2*side)*100)/100;}
  return Math.max(0,Math.round(v/(e.step||1))*(e.step||1));
}
function platesFor(total){
  let side=Math.round(((total-DB.settings.bar-2*collarKg())/2)*100)/100;const out=[];
  for(const p of PLATES){while(side>=p-1e-6){out.push(p);side=Math.round((side-p)*100)/100;}}
  return out;
}
function plateDiff(a,b){ // a→b の差
  const ca={},cb={};a.forEach(p=>ca[p]=(ca[p]||0)+1);b.forEach(p=>cb[p]=(cb[p]||0)+1);
  const add=[],rem=[];PLATES.forEach(p=>{const d=(cb[p]||0)-(ca[p]||0);for(let i=0;i<Math.abs(d);i++)(d>0?add:rem).push(p);});
  return {add,rem};
}

/* ===== 目標の自動アップ（初心者向けダブル・プログレッション） =====
   ・全セットで回数の上限ができたら → 次回は重量アップ（バーベル+2.5kg／ダンベル・マシン+1kg）、回数は下限から
   ・上限に届かなければ → 同じ重量で、いちばん少なかったセット＋1回を目標に
   ・下限に届かない回が2回続いたら → 10%下げて立て直す */
function history(id){return DB.sessions.filter(s=>s.date<TODAY&&s.items.some(i=>i.ex===id)).sort((a,b)=>a.date<b.date?1:-1).map(s=>({date:s.date,it:s.items.find(i=>i.ex===id)}));}
function nextTarget(id){
  const e=EX[id],h=history(id),[lo,hi]=e.rep||[0,0];
  if(e.time){ // 秒数で行う種目：全セットで目標の秒数ができたら＋10秒
    if(!h.length) return {kg:0,reps:0,sec:e.time.goal,note:null};
    const it=h[0].it,base=(it.target&&it.target.sec)||e.time.goal;
    if(it.sets.every(x=>(x.sec||0)>=base)&&base<e.time.max) return {kg:0,reps:0,sec:base+10,note:'sec'};
    return {kg:0,reps:0,sec:base,note:null};
  }
  if(!h.length) return {kg:e.eq==='body'?0:snap2(id,e.start),reps:e.goal||lo,note:null};
  const it=h[0].it,reps=it.sets.map(s=>s.reps),minR=Math.min(...reps);
  if(e.eq==='body'&&e.goal) return {kg:0,reps:e.goal,note:null};
  if(e.eq==='body'){const r=Math.min(hi,Math.max(lo,minR+1));return {kg:0,reps:r,note:r>minR&&r>lo?'rep':null};}
  const base=it.target?it.target.kg:it.sets[0].kg;
  const heavyEnough=it.sets.every(s=>s.kg>=base-1e-6);
  if(e.goal){
    // 10回が目標。全セット12回以上＝余裕 → 2段階アップ／全セット10回以上 → 1段階アップ／それ以外 → 据え置き
    const g=e.goal;
    // 上げ幅は最大10%まで（ただし最小は1段階）。軽い重さで2段階上げると急すぎるため
    if(heavyEnough&&reps.every(r=>r>=hi)&&base+2*e.inc<=base*1.1+1e-6){const k=snap2(id,base+2*e.inc);return {kg:k,reps:g,note:'up',delta:k-base,big:true};}
    if(heavyEnough&&reps.every(r=>r>=g)){const k=snap2(id,base+e.inc);return {kg:k,reps:g,note:'up',delta:k-base};}
    const fail=it=>it.sets.some(s=>s.reps<lo);
    if(fail(it)&&h[1]&&fail(h[1].it)){const k=snap2(id,base*0.9);return {kg:k,reps:g,note:'down',delta:k-base};}
    return {kg:base,reps:g,note:null};
  }
  if(heavyEnough&&reps.every(r=>r>=hi)) return {kg:snap2(id,base+e.inc),reps:lo,note:'up',delta:snap2(id,base+e.inc)-base};
  const fail=it=>it.sets.some(s=>s.reps<lo);
  if(fail(it)&&h[1]&&fail(h[1].it)){const k=snap2(id,base*0.9);return {kg:k,reps:lo,note:'down',delta:k-base};}
  return {kg:base,reps:Math.min(hi,Math.max(lo,minR+1)),note:null};
}

/* ===== 代わりの種目との換算（推定1RM＝重さ×(1＋回数÷30)） =====
   両方に記録があれば、自分の記録から比率を出す。なければ初期値 f を使う */
const e1=(k,r)=>k*(1+r/30);
const best=it=>Math.max(...it.sets.map(x=>e1(x.kg,x.reps)));
function ratio(src,dst){
  const a=history(src)[0],b=history(dst)[0];
  if(a&&b) return best(b.it)/best(a.it);
  return (EX[dst].f||1)/(EX[src].f||1);
}
function snapDown(id,v){const e=EX[id];if(e.eq==='barbell')return snap2(id,v);const st=e.step||1;return Math.max(0,Math.floor(v/st+1e-6)*st);}
function targetFor(slot,id){
  const opts=slotOf(slot).opts;
  const recs=opts.flatMap(o=>{const h=history(o)[0];return h?[{o,...h}]:[];}).sort((a,b)=>a.date<b.date?1:-1);
  if(!recs.length||recs[0].o===id) return nextTarget(id);
  const src=recs[0].o,t=nextTarget(src),[lo,hi]=EX[id].rep;
  const reps=EX[id].goal||Math.min(hi,Math.max(lo,t.reps));
  const k=snapDown(id,e1(t.kg,t.reps)*ratio(src,id)/(1+reps/30));
  const ls=recs[0].it.sets;
  return {kg:k,reps,note:'conv',from:`${EX[src].name} ${kg(ls[0].kg)}kg×${ls.map(x=>x.reps).join('・')}（${md(recs[0].date)}）から換算${t.note==='up'?'・アップ込み':''}`};
}

function weekStart(s){const t=new Date(tOf(s));const k=(t.getDay()+6)%7;t.setDate(t.getDate()-k);return iso(t);}

}

}

function buildDraft(mode,level,prev){
  const store=prev&&prev.store?prev.store:{};

  if(mode==='gym'||mode==='home'){

    d.items=MENUS[mode][level].items.map(([slot,n,opt])=>{
      const old=pool.find(i=>(i.slot||i.ex)===slot);
      const id=old?old.ex:((DB.choice||{})[slot]||slotOf(slot).opts[0]);
      const t=old?old.tgt:targetFor(slot,id);
      const sets=Array.from({length:n},(_,j)=>old&&old.sets[j]?old.sets[j]:{kg:t.kg,reps:t.reps,sec:t.sec||0,done:false});
      return {slot,ex:id,tgt:t,sets,opt:!!opt};
    });
    if(mode==='gym'){const rank=it=>it.opt?2:(isBB(it)?0:1);d.items.sort((a,b)=>rank(a)-rank(b));}
    // ミニマム⇔フルを切り替えても、やった分は残す

/* ===== スプレッドシート同期（GASのWebアプリ） =====
   ・記録が変わったら8秒後にまとめて送る。アプリを開いたとき・通信が戻ったときにも送る
   ・送っている間に記録が増えたら（rev が変わったら）次回また送る */
let syncTimer=null,syncing=false;
const canSync=()=>!!(DB.settings.gasUrl&&DB.settings.token);
function queueSync(ms=8000){if(!canSync())return;clearTimeout(syncTimer);syncTimer=setTimeout(()=>syncNow(false),ms);}
async function gas(body,ms=25000){
  const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),ms);
  try{
    const r=await fetch(DB.settings.gasUrl,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({token:DB.settings.token,...body}),signal:ac.signal,redirect:'follow'});
    const j=await r.json();if(!j.ok)throw new Error(j.error||'送信に失敗しました');return j;
  }catch(e){throw new Error(e.name==='AbortError'?'時間切れです。電波のよい場所でもう一度':e.message==='Failed to fetch'||e.message==='Load failed'?'つながりません。URLか通信を確認してください':e.message);}
  finally{clearTimeout(tm);}
}
async function syncNow(manual){
  if(!canSync()){if(manual)toast('先にURLと合言葉を設定してください');return;}
  if(syncing)return;if(!navigator.onLine){if(manual)toast('オフラインです。つながったら自動で送ります');return;}
  const ss=DB.sessions.filter(x=>!x.synced&&!x.sample),cs=DB.cardio.filter(x=>!x.synced&&!x.sample),bs=DB.body.filter(x=>!x.synced&&!x.sample),dl={s:[...DB.dels.s],c:[...DB.dels.c]};
  if(!ss.length&&!cs.length&&!bs.length&&!dl.s.length&&!dl.c.length){if(manual)toast('送る記録はありません');return;}
  syncing=true;
  try{
    const j=await gas({action:'push',
      sessions:ss.map(x=>({id:x.id,date:x.date,mode:x.mode,modeName:(MENUS[x.mode]||{}).name||x.mode,level:x.level,rev:x.rev,
        items:x.items.map(i=>({ex:i.ex,name:(EX[i.ex]||{}).name||i.ex,target:i.target,sets:i.sets}))})),
      cardio:cs.map(x=>({id:x.id,date:x.date,type:x.type,typeName:(CTYPES.find(t=>t[0]===x.type)||[0,x.type])[1],min:x.min,km:x.km||0,hr:x.hr||0,rev:x.rev})),
      body:bs.map(x=>({id:x.id,date:x.date,w:x.w,f:x.f,rev:x.rev})),
      dels:dl});
    j.sessions.forEach(r=>{const x=DB.sessions.find(y=>y.id===r.id);if(x&&x.rev===r.rev)x.synced=true;});
    j.cardio.forEach(r=>{const x=DB.cardio.find(y=>y.id===r.id);if(x&&x.rev===r.rev)x.synced=true;});
    (j.body||[]).forEach(r=>{const x=DB.body.find(y=>y.id===r.id);if(x&&x.rev===r.rev)x.synced=true;});
    DB.dels.s=DB.dels.s.filter(x=>!dl.s.includes(x));DB.dels.c=DB.dels.c.filter(x=>!dl.c.includes(x));
    DB.sync={at:Date.now(),ok:true,msg:''};save();if(manual)toast('スプレッドシートに送りました');
  }catch(e){DB.sync={at:Date.now(),ok:false,msg:e.message};save();if(manual)toast(e.message);}
  finally{syncing=false;if(ui.tab==='set')render();}
  if(unsynced()&&DB.sync.ok)queueSync(3000);
}
async function pullAll(){
  try{
    const j=await gas({action:'pull'},40000);let n=0;
    // スプレッドシートの記録で上書き。ただしまだ送っていない手元の記録は残す
    j.sessions.forEach(r=>{const x=DB.sessions.find(y=>y.id===r.id);if(x&&!x.synced)return;
      DB.sessions=DB.sessions.filter(y=>y.id!==r.id);

      DB.sessions.push({...r,synced:true,rev:0});n++;});
    j.cardio.forEach(r=>{const x=DB.cardio.find(y=>y.id===r.id);if(x&&!x.synced)return;DB.cardio=DB.cardio.filter(y=>y.id!==r.id);DB.cardio.push({...r,synced:true,rev:0});n++;});
    (j.body||[]).forEach(r=>{const x=DB.body.find(y=>y.id===r.id);if(x&&!x.synced)return;DB.body=DB.body.filter(y=>y.id!==r.id);DB.body.push({...r,synced:true,rev:0});n++;});

}

/* ---- 記録 ---- */
function spark(vals,color,w=120,hgt=40){
  if(vals.length<2) return '';
  const mn=Math.min(...vals),mx=Math.max(...vals),r=mx-mn||1;
  const pts=vals.map((v,i)=>[i/(vals.length-1)*(w-8)+4,hgt-6-(v-mn)/r*(hgt-12)]);
  const last=pts.at(-1);
  return `<svg class="spark" viewBox="0 0 ${w} ${hgt}"><path d="M${pts.map(p=>p.map(n=>n.toFixed(1)).join(' ')).join(' L')}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${last[0]}" cy="${last[1]}" r="4" fill="${color}"/></svg>`;
}
function ticks(min,max){if(min===max){min-=1;max+=1;}const st0=(max-min)/3,mag=Math.pow(10,Math.floor(Math.log10(st0)));const st=[1,2,2.5,5,10].map(m=>m*mag).find(s=>s>=st0);const t=[];for(let v=Math.floor(min/st)*st;v<=Math.ceil(max/st)*st+1e-9;v+=st)t.push(Math.round(v*100)/100);return t;}
function chart(pts,color){
  const W=320,H=150,L=34,R=12,T=14,B=22;
  const tk=ticks(Math.min(...pts.map(p=>p.y)),Math.max(...pts.map(p=>p.y))),y0=tk[0],y1=tk.at(-1);
  const X=k=>pts.length<2?(L+W-R)/2:L+k/(pts.length-1)*(W-L-R),Y=v=>T+(1-(v-y0)/(y1-y0))*(H-T-B);
  let g=tk.map(v=>`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end">${v}</text>`).join('');
  g+=`<path d="M${pts.map((p,k)=>X(k).toFixed(1)+' '+Y(p.y).toFixed(1)).join(' L')}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round"/>`;
  pts.forEach((p,k)=>{g+=`<circle cx="${X(k)}" cy="${Y(p.y)}" r="${k===pts.length-1?4.5:3}" fill="${k===pts.length-1?color:'var(--card)'}" stroke="${color}" stroke-width="2"/><text x="${X(k)}" y="${H-4}" text-anchor="middle">${p.l}</text>`;});
  return `<svg viewBox="0 0 ${W} ${H}">${g}</svg>`;
}
/* 筋力スコア：種目ごとの推定1RMを「その種目の最初の記録＝100」に直し、日ごとに平均したもの。
   代わりの種目は換算の比率で基本の種目にそろえる。ざっくりした目安 */
function strengthSeries(){
  const keyOf=ex=>Object.keys(SLOTS).find(k=>SLOTS[k].opts.includes(ex))||ex;
  const base={},cur={},out=[];
  [...DB.sessions].sort((a,b)=>a.date<b.date?-1:1).forEach(se=>{
    se.items.forEach(it=>{const e=EX[it.ex];if(!e||e.eq==='body'||!it.sets.length)return;
      const k=keyOf(it.ex),p=slotOf(k).opts[0];
      const v=Math.max(...it.sets.map(x=>e1(x.kg,x.reps)))*(it.ex===p?1:ratio(it.ex,p));
      if(!base[k])base[k]=v;cur[k]=v/base[k]*100;});
    const ks=Object.keys(cur);if(!ks.length)return;
    const sc=Math.round(ks.reduce((a,k)=>a+cur[k],0)/ks.length);
    if(out.length&&out.at(-1).date===se.date)out.at(-1).y=sc;else out.push({date:se.date,y:sc});
  });
  return out;
}

    if(open) r+=`<div class="hdet">${chart(hs.map(x=>({y:Math.max(...x.it.sets.map(s=>s.kg)),l:md(x.date)})),'var(--acc)')}
      <div class="hist">${hs.slice(-3).reverse().map(x=>`<span>${md(x.date)}</span><span><b class="n">${kg(x.it.sets[0].kg)}kg</b>　${x.it.sets.map(s=>s.reps).join('・')}回</span>`).join('')}</div></div>`;
    return r;}).join('')+'</div>';
  const goal=DB.settings.runGoal,wk=[3,2,1,0].map(k=>weekRuns(k));

    ${wk.map((w,k)=>`<div style="display:grid;gap:6px;justify-items:center"><div class="gd">${Array.from({length:Math.max(goal,w.length)},(_,j)=>`<i class="${j<w.length?'on':''}"></i>`).join('')}</div>
      <b class="n" style="font-size:15px">${w.reduce((a,c)=>a+(c.km||0),0).toFixed(1)}km</b><span style="font-size:13px;color:var(--sub)">${['3週前','2週前','先週','<b>今週</b>'][k]}</span></div>`).join('')}</div>`;
  h+=`<p class="note">筋力スコアは推定の最大挙上重量から出した目安です。筋トレ・有酸素の過去分はサンプルです。</p>`;
  return h;
}

function altOpts(it){const o=slotOf(it.slot).opts;return o.filter(x=>x!==it.ex);}
function swapChips(it,i){return `<div class="alts"><span class="alts-l">⇄ 替える</span>${altOpts(it).map(x=>`<button class="alt" data-act="swapto" data-i="${i}" data-ex="${x}">${pict(PK[x])}<span>${esc(EX[x].name)}</span></button>`).join('')}</div>`;}
function nextOpt(it){const o=slotOf(it.slot).opts;return o[(o.indexOf(it.ex)+1)%o.length];}
function canSwap(it){return slotOf(it.slot).opts.length>1&&!it.sets.some(s=>s.done);}
function coach(d){
  if(d.mode==='gym'&&d.level==='full'&&estMin('gym','full',true)>60) return '追加種目まで入れると60分を超えます。時間が余ったら分は省いてOK';
  const last=DB.sessions.filter(s=>s.date<TODAY&&(s.mode==='gym'||s.mode==='home')).sort((a,b)=>a.date<b.date?1:-1)[0];
  if(last&&daysAgo(last.date)<2) return '前回から48時間たっていません。今日はミニマムで、重さは据え置きがおすすめ';
  const ups=d.items.filter(i=>i.tgt.note==='up');
  if(ups.length) return `${ups.length}種目が前回クリア → 今日は重さアップ。10回をねらって、きつければ8回でOK`;
  if(d.items.some(i=>i.tgt.note==='down')) return '重さを下げた種目は、フォームを丁寧に。2〜3回で元に戻ります';
  return 'どの種目も10回をねらって。きつければ8回、余裕なら12回まで';
}
/* ===== 音（iPhoneは最初のタップのあとに鳴らせる） ===== */
let AC=null;
function audioUnlock(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){}}
function beep(f=880,ms=120,n=1){if(!DB.settings.sound||!AC)return;for(let k=0;k<n;k++){try{const o=AC.createOscillator(),g=AC.createGain();const t=AC.currentTime+k*(ms+90)/1000;o.frequency.value=f;g.gain.setValueAtTime(.2,t);g.gain.exponentialRampToValueAtTime(.001,t+ms/1000);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+ms/1000+.02);}catch(e){}}}
let WL=null;
async function wake(on){try{if(on&&!WL&&DB.settings.wake&&'wakeLock' in navigator&&document.visibilityState==='visible'){WL=await navigator.wakeLock.request('screen');WL.addEventListener('release',()=>WL=null);}else if(!on&&WL){await WL.release();WL=null;}}catch(e){WL=null;}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){wake(ui.focus!==null);render();queueSync(1500);}});
/* 秒数の種目のタイマー：準備3秒 →（左）→ 切り替え5秒 →（右） */
function holdPlan(sec,sides){const p=[['prep',3]];if(sides){p.push(['L',sec],['sw',5],['R',sec]);}else p.push(['run',sec]);return p;}
function holdNow(){const H=ui.hold;if(!H)return null;let t=(Date.now()-H.t0)/1000;for(const [ph,len] of H.plan){if(t<len)return {ph,t,len};t-=len;}return {ph:'end',t:0,len:0};}
const PHL={prep:'準備',L:'左',R:'右',sw:'右に替えて',run:''};
let lastTick=-1,lastPh='';
function holdTick(){
  const n=holdNow();if(!n)return;
  if(n.ph==='end'){finishHold(ui.hold.sec);return;}
  const v=$('#holdv'),bar=$('#holdbar'),pl=$('#holdp');
  const shown=n.ph==='prep'||n.ph==='sw'?Math.ceil(n.len-n.t):Math.floor(n.t);
  if(v)v.textContent=shown;if(pl)pl.textContent=PHL[n.ph];
  if(bar)bar.style.width=(n.ph==='prep'||n.ph==='sw'?0:Math.min(100,n.t/n.len*100))+'%';
  if(n.ph!==lastPh){if(lastPh)beep(n.ph==='sw'?660:1046,160,n.ph==='sw'?2:1);lastPh=n.ph;lastTick=-1;}
  const sec10=Math.floor(n.t/10);
  if((n.ph==='run'||n.ph==='L'||n.ph==='R')&&sec10!==lastTick){if(lastTick>=0)beep(880,90);lastTick=sec10;}
  if(n.ph==='prep'){const c=Math.ceil(n.len-n.t);if(c!==lastTick){if(lastTick>=0)beep(660,70);lastTick=c;}}
}
function finishHold(sec){const it=D().items[ui.focus],s=it.sets[ui.cur];ui.hold=null;lastPh='';s.sec=sec;beep(1318,300);completeSet();render();}
/* 取り消し用に直前の状態を覚えておく */
let UNDO=null;
function snap(){UNDO={db:JSON.stringify(DB),focus:ui.focus,cur:ui.cur};}
function undo(){if(!UNDO)return;DB=JSON.parse(UNDO.db);if(DB.draft.store&&DB.draft.store[DB.draft.mode])DB.draft.items=DB.draft.store[DB.draft.mode];ui.focus=UNDO.focus;ui.cur=UNDO.cur;ui.restEnd=0;ui.hold=null;UNDO=null;save();render();toast('取り消しました');}
function completeSet(){
  const d=D(),it=d.items[ui.focus],s=it.sets[ui.cur];
  // 1セット目を押した時点で、その1セット分の時間はもう使っている
  if(!d.t0) d.t0=Date.now()-120000;
  if(isBB(it)&&!d.bbStart) d.bbStart=Date.now()-132000;
  s.done=true;persist();ui.restBeeped=false;
  const label=EX[it.ex].time?`${s.sec}秒`:EX[it.ex].eq==='body'?`${s.reps}回`:`${kg(s.kg)}kg × ${s.reps}回`;
  const nx=it.sets.findIndex(x=>!x.done);
  if(nx>=0){ui.cur=nx;ui.restEnd=Date.now()+restSec(it)*1000;toast(`記録：${label}`,true);}
  else{ui.edit=false;const ni=d.items.findIndex(x=>!x.opt&&x.sets.some(y=>!y.done));
    if(ni>=0){ui.restEnd=Date.now()+restSec(d.items[ni])*1000;toast(`記録：${label}　この種目は完了`,true);}
    else{ui.restEnd=0;toast(it.opt?'おつかれさまでした':'今日のメニュー完了',true);}}
}
/* ===== 操作 ===== */
let tt;function toast(m,canUndo){const t=$('#toast');t.innerHTML=esc(m)+(canUndo&&UNDO?'<button class="undo" data-act="undo">取り消す</button>':'');t.hidden=false;placeToast();clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,canUndo?4000:1800);}
function placeToast(){const dk=$('#dock'),t=$('#toast');const nav=$('nav').offsetHeight;t.style.bottom=(nav+(dk?dk.offsetHeight:0)+10)+'px';}
setInterval(()=>{
  const b=$('#bbt');if(b){const l=bbLeft();b.textContent=l>0?`バーベル枠 残り ${mmss(l)}`:'バーベル枠 時間です';b.classList.toggle('late',l<240);}
  const ep=$('#elap');if(ep&&D().t0){const m=Math.floor((Date.now()-D().t0)/60000);ep.textContent=`開始から ${m}分 ／ 目安 ${estMin(D().mode,D().level,false)}分（上限60分）`;}
},1000);
setInterval(()=>{if(ui.hold)holdTick();},200);
setInterval(()=>{if(ui.restEnd&&!ui.restBeeped&&Date.now()>=ui.restEnd){ui.restBeeped=true;beep(988,180,2);}const el=$('#rest');if(!el)return;const s=Math.ceil((ui.restEnd-Date.now())/1000);if(s<=0){el.textContent='休憩おわり';return;}el.textContent=`休憩 ${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;},250);
function firstUndone(it){const k=it.sets.findIndex(s=>!s.done);return k<0?0:k;}
function openFocus(i){ui.focus=i;ui.cur=firstUndone(D().items[i]);ui.tips=false;ui.edit=false;}

document.addEventListener('click',e=>{
  const tb=e.target.closest('[data-tab]');
  if(tb){ui.wipe=false;ui.pull=false;ui.tab=tb.dataset.tab;ui.focus=null;ui.hold=null;render();scrollTo(0,0);return;}
  audioUnlock();
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act,d=D();
  const it=ui.focus!==null?d.items[ui.focus]:null,s=it?it.sets[ui.cur]:null;
  switch(a){
    case 'mode': DB.draft=buildDraft(el.dataset.k,d.level||'min',d);save();break;
    case 'level': DB.draft=buildDraft(d.mode,el.dataset.k,d);save();break;
    case 'warm': d.warm=!d.warm;save();break;
    case 'focus': openFocus(+el.dataset.i);scrollTo(0,0);break;
    case 'start': {let i=d.items.findIndex(x=>!x.opt&&x.sets.some(y=>!y.done));if(i<0)i=d.items.findIndex(x=>x.sets.some(y=>!y.done));openFocus(i<0?0:i);scrollTo(0,0);break;}
    case 'back': ui.focus=null;ui.hold=null;break;
    case 'tips': e.preventDefault();ui.tips=!ui.tips;break;
    case 'pick': ui.cur=+el.dataset.j;ui.edit=true;break;
    case 'swapto': case 'swap': {snap();const x=d.items[+el.dataset.i];const n=el.dataset.ex||nextOpt(x);x.ex=n;x.tgt=targetFor(x.slot,n);x.sets.forEach(y=>{y.kg=x.tgt.kg;y.reps=x.tgt.reps;});
      DB.choice[x.slot]=n;save();toast(`${EX[n].name}：${EX[n].eq==='body'?'':kg(x.tgt.kg)+'kg × '}${x.tgt.reps}回`,true);break;}
    case 'kg': { const e2=EX[it.ex];const v=snap2(it.ex,s.kg+(+el.dataset.d)*e2.step);
      // 変更はこのセットと、まだやっていない後のセットにも反映
      it.sets.forEach((x,k)=>{if(k===ui.cur||(k>ui.cur&&!x.done))x.kg=v;});break;}
    case 'rep': s.reps=Math.max(0,s.reps+(+el.dataset.d));break;
    case 'doneR': snap();s.reps=+el.dataset.r;completeSet();break;
    case 'done': snap();completeSet();break;
    case 'holdstart': audioUnlock();ui.restEnd=0;ui.hold={t0:Date.now(),sec:s.sec,plan:holdPlan(s.sec,!!EX[it.ex].sides)};lastPh='';lastTick=-1;snap();break;
    case 'holdstop': {const n=holdNow();let v=0;if(n&&(n.ph==='run'||n.ph==='L'||n.ph==='R'))v=Math.floor(n.t/10)*10;if(n&&n.ph==='sw')v=ui.hold.sec;
      if(n&&n.ph==='R')v=Math.floor(n.t/10)*10;if(n&&n.ph==='prep'){ui.hold=null;break;}finishHold(v);return;}
    case 'sec': s.sec=Math.max(10,s.sec+(+el.dataset.d));it.sets.forEach((x,k)=>{if(k>ui.cur&&!x.done)x.sec=s.sec;});break;
    case 'skiprest': ui.restEnd=0;break;
    case 'next': if(ui.focus<d.items.length-1){slideTo(ui.focus+1,-1);}return;
    case 'prev': if(ui.focus>0){slideTo(ui.focus-1,1);}return;
    case 'undo': undo();return;
    case 'ctype': d.cardio.type=el.dataset.k;if(NOKM[el.dataset.k])d.cardio.km=0;else if(!d.cardio.km)d.cardio.km=5;break;
    case 'cmin': d.cardio.min=Math.max(5,d.cardio.min+(+el.dataset.d));break;
    case 'ckm': d.cardio.km=Math.max(0,Math.round((d.cardio.km+(+el.dataset.d))*10)/10);break;
    case 'csave': {const C=d.cardio;DB.cardio=DB.cardio.filter(c=>c.id!=='c'+TODAY);
      DB.cardio.push({id:'c'+TODAY,date:TODAY,type:C.type,min:C.min,km:C.km,hr:+C.hr||0,synced:false,rev:Date.now()});DB.dels.c=DB.dels.c.filter(x=>x!=='c'+TODAY);C.saved=true;save();queueSync(2000);
      const n=weekRuns(0).length;toast(n>=DB.settings.runGoal?`今週${n}回目。えらい！`:`今週${n}回目。記録しました`);break;}
    case 'bopen': ui.bopen=!ui.bopen;break;
    case 'bform': ui.bform=true;break;
    case 'bsave': {const w=parseFloat(($('#b-w')||{}).value),f=parseFloat(($('#b-f')||{}).value);
      if(!(w>20&&w<300)){toast('体重を入れてください');return;}
      DB.body=DB.body.filter(x=>x.date!==TODAY);DB.body.push({id:'b'+TODAY,date:TODAY,w:Math.round(w*10)/10,f:isNaN(f)?0:Math.round(f*10)/10,synced:false,rev:Date.now()});
      ui.bform=false;save();queueSync(2000);toast('記録しました');break;}
    case 'hopen': ui.open=ui.open===el.dataset.k?null:el.dataset.k;break;
    case 'tog': DB.settings[el.dataset.k]=!DB.settings[el.dataset.k];save();break;
    case 'collar': DB.settings.useCollar=!DB.settings.useCollar;save();break;
    case 'sync': syncNow(true);return;
    case 'ping': (async()=>{if(!canSync()){toast('URLと合言葉を入れてください');return;}try{const j=await gas({action:'ping'});toast(j.message||'接続できました');}catch(err){toast(err.message);}})();return;
    case 'gentoken': {if(DB.settings.token&&!ui.genOk){ui.genOk=true;toast('もう一度押すと新しい合言葉に変わります');return;}ui.genOk=false;
      const a=new Uint8Array(18);crypto.getRandomValues(a);DB.settings.token=Array.from(a,b=>'abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789'[b%56]).join('');save();toast('合言葉を作りました。コピーしてGASに設定してください');break;}
    case 'copytoken': {const v=DB.settings.token;if(!v){toast('合言葉がありません');return;}
      navigator.clipboard.writeText(v).then(()=>toast('コピーしました')).catch(()=>{const i=$('#s-token');i.focus();i.select();toast('選択しました。長押しでコピーしてください');});return;}
    case 'pull': if(!ui.pull){ui.pull=true;break;}ui.pull=false;if(!canSync()){toast('URLと合言葉を入れてください');break;}toast('読み込み中…');pullAll();return;
    case 'wipe': if(!ui.wipe){ui.wipe=true;break;} ui.wipe=false;
      DB.sessions=[];DB.cardio=[];DB.body=[];DB.choice={};DB.dels={s:[],c:[]};DB.draft=buildDraft(WEEK[dow].m==='rest'?'gym':WEEK[dow].m,'min',null);save();ui.focus=null;toast('記録を消しました');break;
    case 'reset': {const keep=DB.settings;DB=seed();DB.settings={...DB.settings,gasUrl:keep.gasUrl,token:keep.token};DB.dels={s:[],c:[]};DB.sync={};}DB.draft=buildDraft(WEEK[dow].m==='rest'?'gym':WEEK[dow].m,'min',null);save();ui.focus=null;toast('サンプルデータに戻しました');break;
    default: return;
  }
  render();
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.cfld){D().cardio.hr=t.value.replace(/[^0-9]/g,'');save();}
  if(t.dataset.sstr!==undefined&&t.dataset.sstr){DB.settings[t.dataset.sstr]=t.value.trim();save();}
  if(t.dataset.sfld){const v=parseFloat(t.value);if(!isNaN(v)){DB.settings[t.dataset.sfld]=v;save();}}
});
/* ===== 親指操作：左右スワイプ =====
   ・動き始め8pxで縦か横かを決める（斜めでも横が勝てば横）
   ・指に画面がついてくる。画面幅の2割以上、または素早く払えば切り替え
   ・集中画面では上の情報エリアでも下の操作エリアでもスワイプできる */
let G=null;
const animOK=!matchMedia('(prefers-reduced-motion: reduce)').matches;
function swipeEls(){return [$('#fview'),$('#dock')].filter(Boolean);}
function slideTo(i,dir){ // dir: -1＝左へ送る（次）、1＝右へ送る（前）
  const go=()=>{openFocus(i);render();scrollTo(0,0);
    if(!animOK)return;const els=swipeEls();
    els.forEach(el=>{el.style.transition='none';el.style.transform=`translateX(${-dir*28}%)`;el.style.opacity='0.4';});
    requestAnimationFrame(()=>requestAnimationFrame(()=>els.forEach(el=>{el.style.transition='transform .2s ease-out, opacity .2s';el.style.transform='';el.style.opacity='';})));};
  if(!animOK){go();return;}
  swipeEls().forEach(el=>{el.style.transition='transform .15s ease-in, opacity .15s';el.style.transform=`translateX(${dir*100}%)`;el.style.opacity='0.2';});
  setTimeout(go,150);
}
function springBack(els){els.forEach(el=>{el.style.transition='transform .2s ease-out';el.style.transform='';});}
document.addEventListener('touchstart',e=>{
  if(e.touches.length!==1||e.target.closest('input,textarea,select')){G=null;return;}
  const t=e.touches[0],row=null;
  const fv=ui.tab==='today'&&ui.focus!==null&&!ui.hold&&!!e.target.closest('#fview,#dock');
  G={x:t.clientX,y:t.clientY,t:performance.now(),lock:null,dx:0,row,fv,els:fv?swipeEls():row?[row]:[]};
  if(!G.els.length)G=null;
},{passive:true});
document.addEventListener('touchmove',e=>{
  if(!G)return;const t=e.touches[0],dx=t.clientX-G.x,dy=t.clientY-G.y;
  if(!G.lock){if(Math.abs(dx)<8&&Math.abs(dy)<8)return;G.lock=Math.abs(dx)>Math.abs(dy)*0.8?'h':'v';if(G.lock==='v'){G=null;return;}G.els.forEach(el=>el.style.transition='none');}
  e.preventDefault();
  const off=dx>0?dx:dx*0.15; // 左へはほとんど動かない
  G.dx=dx;G.els.forEach(el=>{el.style.transform=`translateX(${off}px)`;el.style.opacity=String(Math.max(.4,1-Math.max(0,dx)/innerWidth));});
},{passive:false});
document.addEventListener('touchend',()=>{
  if(!G)return;const g=G;G=null;if(g.lock!=='h')return;
  const dt=performance.now()-g.t,pass=g.dx>innerWidth*0.22||(g.dx>40&&g.dx/dt>0.35);
  if(pass){g.els.forEach(el=>{el.style.transition='transform .14s ease-in, opacity .14s';el.style.transform='translateX(100%)';el.style.opacity='0';});
    setTimeout(()=>{ui.focus=null;ui.hold=null;render();scrollTo(0,0);},140);return;}
  g.els.forEach(el=>{el.style.transition='transform .2s ease-out, opacity .2s';el.style.transform='';el.style.opacity='';});
},{passive:true});
document.addEventListener('touchcancel',()=>{if(G){G.els.forEach(el=>{el.style.transition='transform .2s';el.style.transform='';el.style.opacity='';});G=null;}},{passive:true});
render();
queueSync(2500);
})();
</script>
